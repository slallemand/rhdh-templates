apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo-landing.name" . }}
  labels:
    {{- include "demo-landing.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "demo-landing.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-landing.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
      volumes:
        - name: content
          configMap:
            name: {{ include "demo-landing.name" . }}-content
            items:
              - key: index.html
                path: index.html
              - key: styles.css
                path: styles.css
        - name: nginx-config
          configMap:
            name: {{ include "demo-landing.name" . }}-content
            items:
              - key: default.conf
                path: default.conf
