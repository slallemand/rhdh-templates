apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-landing.name" . }}-content
  labels:
    {{- include "demo-landing.labels" . | nindent 4 }}
data:
  index.html: |
    {{- .Files.Get "files/index.html" | nindent 4 }}
  styles.css: |
    {{- .Files.Get "files/styles.css" | nindent 4 }}
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
      }
    }
