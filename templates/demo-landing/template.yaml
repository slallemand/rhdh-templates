apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: demo-landing
  title: Deploy Demo Landing (Helm + GitOps)
  description: >
    Create a GitLab repository with a visual landing-page Helm chart and deploy
    it to OpenShift via OpenShift GitOps (Argo CD). No CI build required.
  tags:
    - recommended
    - demo
    - helm
    - gitops
    - gitlab
    - openshift
spec:
  owner: user:guest
  type: website

  parameters:
    - title: Provide Information for Application
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          default: demo-landing
          ui:field: EntityNamePicker
          maxLength: 63
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Help others understand what this website is for
          default: Visual demo landing page deployed with Helm and OpenShift GitOps

    - title: Application repository Information
      required:
        - repoOwner
      properties:
        repoOwner:
          title: Repo Owner
          type: string
          description: Your SCM host organization/group
          default: demos
        repoVisibility:
          title: Repository visibility
          type: string
          default: public
          enum:
            - private
            - internal
            - public

    - title: OpenShift GitOps
      required:
        - namespace
        - argoInstance
      properties:
        namespace:
          title: Target namespace
          type: string
          description: OpenShift namespace where the app will be synced
          default: demo-landing
        argoInstance:
          title: Argo CD instance name
          type: string
          description: Must match an Argo CD instance configured in RHDH
          default: default

  steps:
    - id: fetch-provision-data
      name: Fetch Provision Data
      action: catalog:fetch
      input:
        entityRef: component:default/provisioning-data

    - id: fetch
      name: Render Helm chart and catalog metadata
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutRender:
          - chart/templates/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: user:default/${{ user.entity.metadata.name }}
          namespace: ${{ parameters.namespace }}
          argoInstance: ${{ parameters.argoInstance }}
          cluster: ${{ steps['fetch-provision-data'].output.entity.metadata.labels['ocp-apps-domain'] }}
          gitlabHost: gitlab-gitlab.${{ steps['fetch-provision-data'].output.entity.metadata.labels['ocp-apps-domain'] }}
          destination: ${{ parameters.repoOwner }}/${{ parameters.name }}
          gitlabGroup: ${{ parameters.repoOwner }}

    - id: publish
      name: Publish repository to GitLab
      action: publish:gitlab
      input:
        repoUrl: 'gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}?owner=${{ parameters.repoOwner }}&repo=${{ parameters.name }}'
        defaultBranch: main
        repoVisibility: ${{ parameters.repoVisibility }}

    - id: register
      name: Register component in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: argocd
      name: Create Argo CD Application
      action: argocd:create-resources
      input:
        appName: ${{ parameters.name }}
        argoInstance: ${{ parameters.argoInstance }}
        namespace: ${{ parameters.namespace }}
        repoUrl: https://gitlab-gitlab.${{ steps['fetch-provision-data'].output.entity.metadata.labels['ocp-apps-domain'] }}/${{ parameters.repoOwner }}/${{ parameters.name }}.git
        path: chart
        labelValue: ${{ parameters.name }}

  output:
    links:
      - title: Open the GitLab repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open the catalog component
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
