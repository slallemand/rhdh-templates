apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.argoNS }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    demo/gitops: ${{ values.name }}
    backstage-name: ${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  project: ${{ values.argoProject }}
  source:
    repoURL: ${{ values.repoURL }}.git
    path: chart
    targetRevision: ${{ values.defaultBranch }}
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.namespace }}
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: ${{ values.argoNS }}
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
