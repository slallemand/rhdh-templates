apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  title: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    argocd/app-selector: demo/gitops=${{ values.name }}
    argocd/instance-name: ${{ values.argoInstance }}
    backstage.io/kubernetes-id: ${{ values.name }}
    backstage.io/source-location: url:https://${{ values.gitlabHost }}/${{ values.destination }}
    gitlab.com/project-slug: ${{ values.destination }}
  labels:
    demo/gitops: ${{ values.name }}
  tags:
    - demo
    - helm
    - gitops
    - openshift
spec:
  type: website
  lifecycle: experimental
  owner: ${{ values.owner }}
