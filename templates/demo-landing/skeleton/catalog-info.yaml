apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name | dump }}
  description: ${{ values.description | dump }}
  annotations:
    # CD (Argo) — same as TSSC / laposte-api
    argocd/app-selector: tssc/gitops=${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}
    backstage.io/source-location: url:https://${{ values.gitlabHost }}/${{ values.destination }}
    # Disable GitLab CI tab: AnnotateScmSlug/GitlabFiller auto-adds project-slug
    # from the GitLab location; empty values turn the GitLab CI views off.
    gitlab.com/project-slug: ""
    gitlab.com/instance: ""
  tags:
    - demo
    - helm
    - gitops
    - openshift
spec:
  type: service
  lifecycle: production
  owner: ${{ values.owner | dump }}
