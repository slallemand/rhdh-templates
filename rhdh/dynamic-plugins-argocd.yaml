# Fragment to merge into the RHDH dynamic-plugins ConfigMap (RHDH 1.10 / Backstage 1.49.4).
# Fixes: empty Argo instances + missing frontend mountPoints for the CD tab after 1.9 → 1.10.
#
# Replace ARGOCD_URL / ARGOCD_AUTH_TOKEN (or username/password) with your OpenShift GitOps values.
# Instance name "default" matches templates/demo-landing (argoInstance default).

plugins:
  - disabled: false
    package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend:bs_1.49.4__1.4.0
    pluginConfig:
      argocd:
        appLocatorMethods:
          - type: config
            instances:
              - name: default
                url: ${ARGOCD_URL}
                token: ${ARGOCD_AUTH_TOKEN}

  - disabled: false
    package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.49.4__2.8.1
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-argocd:
            translationResources:
              - importName: argocdTranslations
                module: Alpha
                ref: argocdTranslationRef
            mountPoints:
              - mountPoint: entity.page.overview/cards
                importName: ArgocdDeploymentSummary
                config:
                  layout:
                    gridColumnEnd:
                      lg: span 8
                      xs: span 12
                  if:
                    allOf:
                      - isArgocdConfigured
              - mountPoint: entity.page.cd/cards
                importName: ArgocdDeploymentLifecycle
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isArgocdConfigured

  - disabled: false
    package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.49.4__1.8.1
    pluginConfig:
      argocd:
        appLocatorMethods:
          - type: config
            instances:
              - name: default
                url: ${ARGOCD_URL}
                token: ${ARGOCD_AUTH_TOKEN}
