includes:
- dynamic-plugins.default.yaml
plugins:
- disabled: false
  package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend:bs_1.49.4__1.4.0
  pluginConfig:
    argocd:
      appLocatorMethods:
      - type: config
        instances:
        - name: default
          url: ${ARGOCD_URL}
          token: ${ARGOCD_AUTH_TOKEN}
- disabled: false
  package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.49.4__2.8.1
  pluginConfig:
    dynamicPlugins:
      frontend:
        backstage-community.plugin-argocd:
          translationResources:
          - importName: argocdTranslations
            module: Alpha
            ref: argocdTranslationRef
          mountPoints:
          - mountPoint: entity.page.overview/cards
            importName: ArgocdDeploymentSummary
            config:
              layout:
                gridColumnEnd:
                  lg: span 8
                  xs: span 12
              if:
                allOf:
                - isArgocdConfigured
          - mountPoint: entity.page.cd/cards
            importName: ArgocdDeploymentLifecycle
            config:
              layout:
                gridColumn: 1 / -1
              if:
                allOf:
                - isArgocdConfigured
- disabled: false
  package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.49.4__1.8.1
  pluginConfig:
    argocd:
      appLocatorMethods:
      - type: config
        instances:
        - name: default
          url: ${ARGOCD_URL}
          token: ${ARGOCD_AUTH_TOKEN}
- disabled: false
  package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.49.4__3.37.0
  pluginConfig:
    dynamicPlugins:
      frontend:
        backstage-community.plugin-tekton:
          mountPoints:
          - config:
              if:
                allOf:
                - isTektonCIAvailable
              layout:
                gridColumn: 1 / -1
                gridRowStart: 1
            importName: TektonCI
            mountPoint: entity.page.ci/cards
- disabled: false
  package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/immobiliarelabs-backstage-plugin-gitlab:bs_1.49.4__7.0.1
  pluginConfig:
    dynamicPlugins:
      frontend:
        immobiliarelabs.backstage-plugin-gitlab:
          mountPoints:
          - config:
              if:
                allOf:
                - isGitlabAvailable
                - hasAnnotation:
                  - gitlab.com/enabled
              layout:
                gridColumn: 1 / -1
            importName: EntityGitlabPipelinesTable
            mountPoint: entity.page.ci/cards
- disabled: false
  package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/immobiliarelabs-backstage-plugin-gitlab-backend:bs_1.49.4__7.0.1
- disabled: false
  package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-jenkins:bs_1.49.4__0.30.0
  pluginConfig:
    dynamicPlugins:
      frontend:
        backstage-community.plugin-jenkins:
          mountPoints:
          - config:
              if:
                allOf:
                - isJenkinsAvailable
              layout:
                gridColumn: 1 / -1
            importName: EntityJenkinsContent
            mountPoint: entity.page.ci/cards
- disabled: false
  package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-jenkins-backend:bs_1.49.4__0.27.0
- disabled: false
  package: oci://quay.io/redhat-tssc/backstage-plugins:1.9.0!tssc-plugins-backstage-community-plugin-multi-source-security-viewer
  pluginConfig:
    dynamicPlugins:
      frontend:
        tssc-plugins.backstage-community-plugin-multi-source-security-viewer:
          entityTabs:
          - mountPoint: entity.page.ci
            path: /ci
            title: CI
          mountPoints:
          - config:
              if:
                allOf:
                - isMultiCIAvailable
              layout:
                gridColumn: 1 / -1
                gridRowStart: 2
            importName: EntityMultiCIPipelinesContent
            mountPoint: entity.page.ci/cards
- disabled: false
  package: oci://quay.io/redhat-tssc/backstage-plugins:1.9.0!tssc-plugins-backstage-community-plugin-multi-source-security-viewer-backend
